name: Portfolio Simulation

on:
  push:
    paths:
      - ".github/workflows/portfolio-simulation.yml"
  workflow_dispatch:
    inputs:
      currency:
        description: "Run one market currency at a time (FX conversion is not included)"
        required: true
        type: choice
        options: [USD]
      period:
        description: "Historical window"
        required: true
        type: choice
        default: "5y"
        options: ["2y", "5y", "10y"]
      capital:
        description: "Starting capital"
        required: true
        default: "1000"
        type: string
      max_positions:
        description: "Maximum concurrent positions"
        required: true
        default: "3"
        type: string
      cost_bps:
        description: "Round-trip transaction cost in basis points"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strategy: [momentum, breakout, pullback_reclaim, regime_adaptive]
        holding: [1, 2, 3, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run portfolio simulation
        env:
          SIM_PERIOD: ${{ inputs.period || '5y' }}
          SIM_CURRENCY: ${{ inputs.currency || 'USD' }}
          SIM_CAPITAL: ${{ inputs.capital || '1000' }}
          SIM_HOLDING: ${{ matrix.holding }}
          SIM_START_DATE: "2024-11-14"
          SIM_MAX_POSITIONS: ${{ inputs.max_positions || '3' }}
          SIM_COST_BPS: ${{ inputs.cost_bps || '20' }}
          SIM_STRATEGY: ${{ matrix.strategy }}
        run: |
          mkdir -p reports
          PYTHONPATH=src python -m stock_picker.portfolio_backtest \
            --universe config/universe.json \
            --period "$SIM_PERIOD" \
            --currency "$SIM_CURRENCY" \
            --capital "$SIM_CAPITAL" \
            --holding "$SIM_HOLDING" \
            --start-date "$SIM_START_DATE" \
            --max-positions "$SIM_MAX_POSITIONS" \
            --strategy "$SIM_STRATEGY" \
            --cost-bps "$SIM_COST_BPS" \
            --output "reports/portfolio-backtest-$SIM_STRATEGY-${SIM_HOLDING}d.json"
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-simulation-${{ matrix.strategy }}-${{ matrix.holding }}d-${{ github.run_number }}
          path: reports/portfolio-backtest-${{ matrix.strategy }}-${{ matrix.holding }}d.json
          if-no-files-found: error
