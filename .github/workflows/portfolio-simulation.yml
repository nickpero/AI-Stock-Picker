name: Portfolio Simulation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/portfolio-simulation.yml"

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        strategy:
          - momentum
          - breakout
          - pullback_reclaim
          - regime_adaptive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run portfolio simulation
        env:
          SIM_PERIOD: ${{ inputs.period || '5y' }}
          SIM_CURRENCY: ${{ inputs.currency || 'EUR' }}
          SIM_CAPITAL: ${{ inputs.capital || '1000' }}
          SIM_HOLDING: ${{ inputs.holding || '5' }}
          SIM_MAX_POSITIONS: ${{ inputs.max_positions || '4' }}
          SIM_COST_BPS: ${{ inputs.cost_bps || '20' }}
          SIM_STRATEGY: ${{ matrix.strategy }}
        run: |
          PYTHONPATH=src python -m stock_picker.portfolio_backtest \
            --universe config/universe.json \
            --period "$SIM_PERIOD" \
            --currency "$SIM_CURRENCY" \
            --capital "$SIM_CAPITAL" \
            --holding "$SIM_HOLDING" \
            --max-positions "$SIM_MAX_POSITIONS" \
            --strategy "$SIM_STRATEGY" \
            --cost-bps "$SIM_COST_BPS" \
            --output "reports/portfolio-backtest-$SIM_STRATEGY.json"
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-simulation-EUR-$${{ matrix.strategy }}-${{ github.run_number }}
          path: reports/portfolio-backtest-$${{ matrix.strategy }}.json
          if-no-files-found: error
